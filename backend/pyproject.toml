[project]
name = "allaroundfood"
version = "0.1.0"
description = "All Around Food parse worker (ADR 0008: queue + URL cache)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1.15",
    "pydantic-settings>=2.6",
    "pywhispercpp>=1.5",
    "supabase>=2.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allaroundfood"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/allaroundfood"]

[tool.pytest.ini_options]
markers = [
    "network: tests that call external network services or local out-of-process services",
    "slow: tests that are slow (e.g. download a real ML model); skipped by default",
]
