[project]
name = "allaroundfood"
version = "0.1.0"
description = "All Around Food backend (Polars file-backed; FastAPI planned)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "yt-dlp>=2025.1.15",
    "pyzipcode>=3.0",
    "tenacity>=9.0",
    "pydantic-settings>=2.6",
    "playwright>=1.48",
    "playwright-stealth>=1.0.6",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "numpy>=2.1",
    "rapidfuzz>=3.10",
    "llama-cpp-python>=0.3",
    "pillow>=11.0",
    "pdf2image>=1.17",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "respx>=0.21",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allaroundfood"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default args is intentional

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/allaroundfood"]

[tool.pytest.ini_options]
markers = [
    "network: tests that call external network services or local out-of-process services",
    "slow: tests that are slow (e.g. download a real ML model); skipped by default",
]
